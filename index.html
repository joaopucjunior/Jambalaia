const DEFAULT_PEOPLE = [

const INK = "#2B2118";

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function seedState() {
  return {
    people: DEFAULT_PEOPLE,
    months: SEED_MONTHS.map((m) => ({
      id: uid(), name: m.name, year: m.year,
      items: m.items.map((it) => ({ id: uid(), ...it })),
      extras: m.extras.map((ex) => ({ id: uid(), split: "all", ...ex })),
    })),
  };
}

const BRL = (n) => (isNaN(n) ? 0 : n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
function sum(list) { return list.reduce((a, b) => a + (parseFloat(b.value) || 0), 0); }

function computeMonth(m, people) {
  const total = sum(m.items);
  const n = people.length || 1;
  const base = total / n;
  const perPerson = {};
  people.forEach((p) => (perPerson[p.id] = base));
  m.extras.forEach((ex) => {
    const v = parseFloat(ex.value) || 0;
    if (!ex.split || ex.split === "all") {
      people.forEach((p) => (perPerson[p.id] += v / n));
    } else if (perPerson[ex.split] !== undefined) {
      perPerson[ex.split] += v;
    } else {
      people.forEach((p) => (perPerson[p.id] += v / n));
    }
  });
  return { total, perPerson };
}

function buildReceiptText(m, people) {
  const { total, perPerson } = computeMonth(m, people);
  const lines = [];
  lines.push(`CONTA DA CASA — ${m.name.toUpperCase()} ${m.year}`);
  lines.push("");
  m.items.forEach((it) => lines.push(`${it.label}: ${BRL(parseFloat(it.value) || 0)}`));
  lines.push("—");
  lines.push(`Total: ${BRL(total)}`);
  if (m.extras.length) {
    lines.push("");
    m.extras.forEach((ex) => {
      const v = parseFloat(ex.value) || 0;
      const who = !ex.split || ex.split === "all" ? "todos" : (people.find((p) => p.id === ex.split)?.name || "todos");
      lines.push(`${ex.label} (${who}): ${v >= 0 ? "+" : ""}${BRL(v)}`);
    });
  }
  lines.push("—");
  people.forEach((p) => lines.push(`${p.name.toUpperCase()}: ${BRL(perPerson[p.id] || 0)}`));
  return lines.join("\n");
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

async function drawReceiptCanvas(m, people) {
  try {
    await Promise.all([
      document.fonts.load('600 34px Fraunces'), document.fonts.load('italic 600 34px Fraunces'),
      document.fonts.load('600 20px Fraunces'), document.fonts.load('500 14px "IBM Plex Mono"'),
      document.fonts.load('600 12px Inter'), document.fonts.load('500 15px Inter'),
    ]);
    await document.fonts.ready;
  } catch (e) {}

  const { total, perPerson } = computeMonth(m, people);
  const rowH = 34;
  const extrasHeight = m.extras.length ? 34 + m.extras.length * rowH + 10 : 0;
  const peopleHeight = people.length * 28;
  const W = 640;
  const H = 230 + m.items.length * rowH + extrasHeight + peopleHeight + 110;

  const canvas = document.createElement("canvas");
  const scale = 2;
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  ctx.fillStyle = APP_BG; ctx.fillRect(0, 0, W, H);
  const pad = 26; const cardY = pad + 14;
  roundRect(ctx, pad, cardY, W - pad * 2, H - pad * 2 - 14, 3);
  ctx.fillStyle = PAPER; ctx.fill();
  ctx.fillStyle = APP_BG;
  for (let x = pad + 10; x < W - pad; x += 20) { ctx.beginPath(); ctx.arc(x, cardY, 7, 0, Math.PI * 2); ctx.fill(); }

  let y = cardY + 44; const left = pad + 30; const right = W - pad - 30;
  ctx.fillStyle = INK_SOFT; ctx.font = "600 11px Inter"; ctx.textBaseline = "alphabetic";
  ctx.fillText("CONTA DA CASA", left, y); y += 30;
  ctx.fillStyle = INK; ctx.font = "italic 600 28px Fraunces";
  ctx.fillText(`${m.name} ${m.year}`, left, y); y += 26;

  m.items.forEach((it) => {
    y += rowH;
    ctx.fillStyle = INK; ctx.font = "500 14px Inter"; ctx.fillText(it.label, left, y);
    const valText = BRL(parseFloat(it.value) || 0);
    ctx.font = "500 14px 'IBM Plex Mono'";
    const valW = ctx.measureText(valText).width;
    ctx.fillStyle = INK; ctx.fillText(valText, right - valW, y);
    ctx.strokeStyle = "#B9AE8E"; ctx.setLineDash([1.5, 3]);
    ctx.beginPath(); ctx.moveTo(left + ctx.measureText(it.label).width + 78, y - 4); ctx.lineTo(right - valW - 8, y - 4); ctx.stroke();
    ctx.setLineDash([]);
  });

  y += 22; ctx.strokeStyle = GOLD; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); ctx.setLineDash([]); y += 26;

  ctx.font = "500 13px Inter"; ctx.fillStyle = INK_SOFT; ctx.fillText("Total da casa", left, y);
  ctx.font = "500 13px 'IBM Plex Mono'";
  const tW = ctx.measureText(BRL(total)).width; ctx.fillText(BRL(total), right - tW, y);

  if (m.extras.length) {
    y += 30; ctx.font = "600 11px Inter"; ctx.fillStyle = INK_SOFT; ctx.fillText("FORA DO PADRÃO", left, y);
    m.extras.forEach((ex) => {
      y += rowH;
      const v = parseFloat(ex.value) || 0;
      const who = !ex.split || ex.split === "all" ? "todos" : (people.find((p) => p.id === ex.split)?.name || "todos");
      ctx.font = "500 14px Inter"; ctx.fillStyle = INK; ctx.fillText(`${ex.label} (${who})`, left, y);
      const valText = `${v >= 0 ? "+" : ""}${BRL(v)}`;
      ctx.font = "500 14px 'IBM Plex Mono'"; ctx.fillStyle = v < 0 ? WINE : JADE;
      const vw = ctx.measureText(valText).width; ctx.fillText(valText, right - vw, y);
    });
  }

  y += 26; ctx.strokeStyle = GOLD; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); ctx.setLineDash([]); y += 34;

  people.forEach((p) => {
    ctx.font = "600 12px Inter"; ctx.fillStyle = INK_SOFT; ctx.fillText(p.name.toUpperCase(), left, y);
    ctx.font = "600 20px Fraunces"; ctx.fillStyle = INK;
    const vt = BRL(perPerson[p.id] || 0); const vw = ctx.measureText(vt).width;
    ctx.fillText(vt, right - vw, y);
    y += 30;
  });

  return canvas;
}

function EditableLabel({ value, onCommit, style }) {
  const [editing, setEditing] = useState(false);
  const [temp, setTemp] = useState(value);
  if (editing) {
    return (
      <input autoFocus value={temp} onChange={(e) => setTemp(e.target.value)}
        onBlur={() => { setEditing(false); if (temp.trim()) onCommit(temp.trim()); }}
        onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
        className="bg-transparent border-b border-dashed"
        style={{ borderColor: GOLD, color: INK, fontSize: 13, minWidth: 60, outline: "none", ...style }} />
    );
  }
  return (
    <button onClick={() => { setTemp(value); setEditing(true); }}
      style={{ color: INK, fontSize: 13, textAlign: "left", background: "none", border: "none", cursor: "pointer", ...style }}>
      {value}
    </button>
  );
}

function EditableValue({ value, onCommit, colorHex }) {
  const [editing, setEditing] = useState(false);
  const [temp, setTemp] = useState(String(value));
  if (editing) {
    return (
      <input autoFocus inputMode="decimal" value={temp} onChange={(e) => setTemp(e.target.value)}
        onBlur={() => { setEditing(false); const parsed = parseFloat(String(temp).replace(",", ".")); onCommit(isNaN(parsed) ? 0 : parsed); }}
        onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
        className="bg-transparent border-b border-dashed w-20 text-right"
        style={{ borderColor: GOLD, color: INK, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13.5, outline: "none" }} />
    );
  }
  return (
    <button onClick={() => { setTemp(String(value)); setEditing(true); }}
      className="font-mono tabular-nums text-[13.5px]"
      style={{ color: colorHex || INK, background: "none", border: "none", cursor: "pointer" }}>
      {BRL(value)}
    </button>
  );
}

function AssigneeChip({ split, people, onChange }) {
  const options = ["all", ...people.map((p) => p.id)];
  const label = split === "all" || !split ? "Todos" : (people.find((p) => p.id === split)?.name.split(" ")[0] || "Todos");
  const cycle = () => {
    const idx = options.indexOf(split || "all");
    onChange(options[(idx + 1) % options.length]);
  };
  return (
    <button onClick={cycle} className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full"
      style={{ background: "#EDE4CC", color: INK_SOFT, border: `1px solid ${LINE}`, cursor: "pointer" }}>
      {label}
    </button>
  );
}

function LineRow({ label, value, colorHex, split, people, onLabelChange, onValueChange, onSplitChange, onRemove }) {
  return (
    <div className="flex items-center gap-2 py-1.5">
      <EditableLabel value={label} onCommit={onLabelChange} />
      <span className="flex-1 border-b border-dotted" style={{ borderColor: "#B9AE8E" }} />
      {people && <AssigneeChip split={split} people={people} onChange={onSplitChange} />}
      <EditableValue value={value} onCommit={onValueChange} colorHex={colorHex} />
      <button onClick={onRemove} className="ml-1 text-[13px] w-5 h-5 flex items-center justify-center rounded-full"
        style={{ color: WINE, opacity: 0.55, background: "none", border: "none", cursor: "pointer" }} aria-label={`Remover ${label}`}>✕</button>
    </div>
  );
}

function AddRow({ placeholder, onAdd, accentHex, people }) {
  const [open, setOpen] = useState(false);
  const [label, setLabel] = useState("");
  const [value, setValue] = useState("");
  const [split, setSplit] = useState("all");

  const submit = () => {
    if (!label.trim() || value === "") return;
    const payload = { label: label.trim(), value: parseFloat(value.replace(",", ".")) || 0 };
    if (people) payload.split = split;
    onAdd(payload);
    setLabel(""); setValue(""); setSplit("all"); setOpen(false);
  };

  if (!open) {
    return (
      <button onClick={() => setOpen(true)} className="mt-1.5 text-[12px] font-semibold flex items-center gap-1"
        style={{ color: accentHex, background: "none", border: "none", cursor: "pointer" }}>
        <span className="text-[15px] leading-none">+</span> {placeholder}
      </button>
    );
  }
  return (
    <div className="mt-2 space-y-1.5">
      <div className="flex items-center gap-1.5">
        <input autoFocus value={label} onChange={(e) => setLabel(e.target.value)} placeholder="Descrição"
          className="flex-1 min-w-0 rounded px-2 py-1.5 text-[13px]"
          style={{ background: "#F1EBDA", border: `1px solid ${LINE}`, color: INK }} />
        <input value={value} onChange={(e) => setValue(e.target.value)} placeholder="0,00" inputMode="decimal"
          className="w-20 rounded px-2 py-1.5 text-[13px] font-mono"
          style={{ background: "#F1EBDA", border: `1px solid ${LINE}`, color: INK }}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
      </div>
      {people && (
        <div className="flex items-center gap-1.5 flex-wrap">
          <span className="text-[11px]" style={{ color: INK_SOFT }}>pra quem:</span>
          {["all", ...people.map((p) => p.id)].map((opt) => {
            const name = opt === "all" ? "Todos" : people.find((p) => p.id === opt)?.name.split(" ")[0];
            const active = split === opt;
            return (
              <button key={opt} onClick={() => setSplit(opt)}
                className="text-[11px] font-semibold px-2 py-0.5 rounded-full"
                style={active ? { background: accentHex, color: PAPER, border: `1px solid ${accentHex}` } : { background: "transparent", color: INK_SOFT, border: `1px solid ${LINE}` }}>
                {name}
              </button>
            );
          })}
        </div>
      )}
      <div className="flex items-center gap-1.5">
        <button onClick={submit} className="text-white text-[12px] font-semibold px-2.5 py-1.5 rounded" style={{ backgroundColor: accentHex, border: "none", cursor: "pointer" }}>OK</button>
        <button onClick={() => setOpen(false)} className="text-[12px] px-1" style={{ color: INK_SOFT, background: "none", border: "none", cursor: "pointer" }}>✕</button>
      </div>
    </div>
  );
}

function Jambalaia() {
  const [people, setPeople] = useState(DEFAULT_PEOPLE);
  const [months, setMonths] = useState(null);
  const [activeId, setActiveId] = useState(null);
  const [toast, setToast] = useState("");
  const [loading, setLoading] = useState(true);
  const [exporting, setExporting] = useState(false);
  const scrollerRef = useRef(null);

  useEffect(() => {
    if (db) {
      const unsub = DOC_REF().onSnapshot(
        (snap) => {
          if (snap.exists) {
            const data = snap.data();
            setPeople(data.people && data.people.length ? data.people : DEFAULT_PEOPLE);
            setMonths(data.months || []);
            setActiveId((prev) => prev || (data.months && data.months.length ? data.months[data.months.length - 1].id : null));
          } else {
            const seeded = seedState();
            DOC_REF().set(seeded);
          }
          setLoading(false);
        },
        (err) => { console.error(err); showToast("Erro ao conectar no Firebase"); setLoading(false); }
      );
      return () => unsub();
    } else {
      try {
        const raw = localStorage.getItem("jambalaia-state-v2");
        if (raw) {
          const data = JSON.parse(raw);
          setPeople(data.people || DEFAULT_PEOPLE);
          setMonths(data.months || []);
          setActiveId(data.months?.[data.months.length - 1]?.id ?? null);
        } else throw new Error("no data");
      } catch (e) {
        const seeded = seedState();
        setPeople(seeded.people);
        setMonths(seeded.months);
        setActiveId(seeded.months[seeded.months.length - 1].id);
        localStorage.setItem("jambalaia-state-v2", JSON.stringify(seeded));
      }
      setLoading(false);
    }
  }, []);

  const persist = (nextPeople, nextMonths) => {
    setPeople(nextPeople);
    setMonths(nextMonths);
    const payload = { people: nextPeople, months: nextMonths };
    if (db) { DOC_REF().set(payload).catch((e) => showToast("Falha ao sincronizar")); }
    else { localStorage.setItem("jambalaia-state-v2", JSON.stringify(payload)); }
  };

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2400); };

  if (loading || !months) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: APP_BG }}>
        <div className="font-mono text-sm animate-pulse" style={{ color: GOLD }}>carregando recibos…</div>
      </div>
    );
  }

  const active = months.find((m) => m.id === activeId) || months[months.length - 1];
  const { total, perPerson } = computeMonth(active, people);

  const updateActiveMonth = (fn) => persist(people, months.map((m) => (m.id === active.id ? fn(m) : m)));

  const addItem = (item) => updateActiveMonth((m) => ({ ...m, items: [...m.items, { id: uid(), ...item }] }));
  const removeItem = (id) => updateActiveMonth((m) => ({ ...m, items: m.items.filter((i) => i.id !== id) }));
  const editItem = (id, field, val) => updateActiveMonth((m) => ({ ...m, items: m.items.map((i) => (i.id === id ? { ...i, [field]: val } : i)) }));
  const addExtra = (extra) => updateActiveMonth((m) => ({ ...m, extras: [...m.extras, { id: uid(), split: "all", ...extra }] }));
  const removeExtra = (id) => updateActiveMonth((m) => ({ ...m, extras: m.extras.filter((i) => i.id !== id) }));
  const editExtra = (id, field, val) => updateActiveMonth((m) => ({ ...m, extras: m.extras.map((i) => (i.id === id ? { ...i, [field]: val } : i)) }));

  const editPersonName = (id, name) => persist(people.map((p) => (p.id === id ? { ...p, name } : p)), months);

  const addMonth = () => {
    const usedNames = months.filter((m) => m.year === active.year).map((m) => m.name);
    const nextIdx = MONTH_NAMES.findIndex((n) => !usedNames.includes(n));
    const name = nextIdx === -1 ? "Novo mês" : MONTH_NAMES[nextIdx];
    // Carrega TODOS os itens fixos do mês anterior com os mesmos valores — só ajusta o que mudou.
    const carry = active.items.map((it) => ({ id: uid(), label: it.label, value: it.value }));
    const newMonth = { id: uid(), name, year: active.year, items: carry, extras: [] };
    persist(people, [...months, newMonth]);
    setActiveId(newMonth.id);
    setTimeout(() => scrollerRef.current?.scrollTo({ left: 999999, behavior: "smooth" }), 50);
  };

  const removeMonth = (id) => {
    if (months.length <= 1) return;
    const next = months.filter((m) => m.id !== id);
    persist(people, next);
    if (activeId === id) setActiveId(next[next.length - 1].id);
  };

  const copyText = async () => {
    try { await navigator.clipboard.writeText(buildReceiptText(active, people)); showToast("Texto copiado ✓"); }
    catch (e) { showToast("Não foi possível copiar"); }
  };

  const exportImage = async () => {
    setExporting(true);
    try {
      const canvas = await drawReceiptCanvas(active, people);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.95));
      if (!blob) throw new Error("no blob");
      const file = new File([blob], `recibo-${active.name}-${active.year}.jpg`, { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: `Recibo ${active.name}`, text: `Conta de ${active.name}` });
          showToast("Enviado ✓"); setExporting(false); return;
        } catch (shareErr) {}
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `recibo-${active.name}-${active.year}.jpg`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      showToast("Imagem baixada ✓");
    } catch (e) { showToast("Não foi possível gerar a imagem"); }
    setExporting(false);
  };

  return (
    <div className="min-h-screen flex flex-col" style={{ background: APP_BG }}>
      <div className="flex flex-col flex-1">
        <div className="px-5 pt-6 pb-2 flex items-end justify-between">
          <div>
            <div className="text-[11px] tracking-[0.2em] font-semibold" style={{ color: INK_SOFT }}>CONTROLE DA CASA</div>
            <h1 className="italic text-[26px] leading-tight -mt-0.5" style={{ color: INK, fontFamily: "'Fraunces', serif" }}>Jambalaia</h1>
          </div>
          <div className="text-[11px] font-mono mb-1" style={{ color: INK_SOFT }}>{active.year}</div>
        </div>

        {!db && (
          <div className="mx-5 mb-2 px-3 py-1.5 rounded text-[11px]" style={{ background: "#F1DCC4", color: "#7A4A1F" }}>
            Modo local — sem Firebase configurado, os dados não sincronizam entre aparelhos ainda.
          </div>
        )}

        <div className="px-5 pb-3 flex items-center gap-1.5 flex-wrap">
          {people.map((p) => (
            <span key={p.id} className="flex items-center gap-1 text-[11px] px-2 py-1 rounded-full" style={{ background: "#E4DBC4", color: INK }}>
              <EditableLabel value={p.name} onCommit={(v) => editPersonName(p.id, v)} style={{ fontSize: 11, fontWeight: 600 }} />
            </span>
          ))}
        </div>

        <div ref={scrollerRef} className="flex gap-2 px-5 pb-4 overflow-x-auto" style={{ scrollbarWidth: "none" }}>
          {months.map((m) => {
            const isActive = m.id === active.id;
            return (
              <button key={m.id} onClick={() => setActiveId(m.id)}
                className="shrink-0 px-3.5 py-1.5 rounded-full text-[13px] font-semibold border transition-colors"
                style={isActive ? { background: GOLD, color: PAPER, borderColor: GOLD } : { background: "transparent", color: INK_SOFT, borderColor: LINE }}>
                {m.name.slice(0, 3)}
              </button>
            );
          })}
          <button onClick={addMonth} className="shrink-0 w-8 h-8 rounded-full border border-dashed flex items-center justify-center text-sm" style={{ borderColor: "#C2B892", color: INK_SOFT }} aria-label="Adicionar mês">+</button>
        </div>

        <div className="px-5 pb-6 flex-1">
          <div className="max-w-md mx-auto">
            <div className="rounded-t-sm relative" style={{ background: PAPER, boxShadow: "0 18px 34px -18px rgba(43,33,24,0.35)" }}>
              <div aria-hidden="true" style={{
                height: 14, backgroundImage: `radial-gradient(circle at 10px 0px, ${APP_BG} 7px, transparent 7.5px)`,
                backgroundSize: "20px 20px", backgroundRepeat: "repeat-x", backgroundPosition: "top center" }} />
              <div className="px-6 pt-3 pb-6">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[10.5px] tracking-[0.18em] font-semibold" style={{ color: INK_SOFT }}>
                    RECIBO Nº {String(months.indexOf(active) + 1).padStart(2, "0")}
                  </span>
                  {months.length > 1 && (
                    <button onClick={() => removeMonth(active.id)} className="text-[10px]" style={{ color: WINE, opacity: 0.75, background: "none", border: "none", cursor: "pointer" }}>excluir mês</button>
                  )}
                </div>
                <h2 className="text-[22px] mb-3" style={{ color: INK, fontFamily: "'Fraunces', serif" }}>
                  {active.name} <span className="text-[15px]" style={{ color: INK_SOFT }}>{active.year}</span>
                </h2>

                <div className="divide-y" style={{ borderColor: "#EAE2CB" }}>
                  {active.items.map((it) => (
                    <LineRow key={it.id} label={it.label} value={parseFloat(it.value) || 0}
                      onLabelChange={(v) => editItem(it.id, "label", v)} onValueChange={(v) => editItem(it.id, "value", v)} onRemove={() => removeItem(it.id)} />
                  ))}
                </div>
                <AddRow placeholder="adicionar conta" onAdd={addItem} accentHex={JADE} />

                <div className="my-4 h-px" style={{ backgroundImage: `repeating-linear-gradient(90deg, ${GOLD} 0 6px, transparent 6px 12px)` }} />

                <div className="flex justify-between text-[13px] mb-3" style={{ color: INK_SOFT }}>
                  <span>Total da casa</span><span className="font-mono">{BRL(total)}</span>
                </div>

                {active.extras.length > 0 && (
                  <div className="mb-3">
                    <div className="text-[10.5px] tracking-[0.14em] font-semibold mb-1" style={{ color: INK_SOFT }}>FORA DO PADRÃO</div>
                    <div className="divide-y" style={{ borderColor: "#EAE2CB" }}>
                      {active.extras.map((ex) => {
                        const v = parseFloat(ex.value) || 0;
                        return (
                          <LineRow key={ex.id} label={ex.label} value={v} colorHex={v < 0 ? WINE : JADE}
                            split={ex.split} people={people}
                            onLabelChange={(val) => editExtra(ex.id, "label", val)}
                            onValueChange={(val) => editExtra(ex.id, "value", val)}
                            onSplitChange={(val) => editExtra(ex.id, "split", val)}
                            onRemove={() => removeExtra(ex.id)} />
                        );
                      })}
                    </div>
                  </div>
                )}
                <AddRow placeholder="adicionar extra" onAdd={addExtra} accentHex={WINE} people={people} />

                <div className="my-4 h-px" style={{ backgroundImage: `repeating-linear-gradient(90deg, ${GOLD} 0 6px, transparent 6px 12px)` }} />

                <div className="space-y-1.5">
                  {people.map((p) => (
                    <div key={p.id} className="flex justify-between items-baseline">
                      <span className="text-[11px] tracking-wide font-semibold" style={{ color: INK_SOFT }}>{p.name.toUpperCase()}</span>
                      <span className="text-[22px]" style={{ color: INK, fontFamily: "'Fraunces', serif" }}>{BRL(perPerson[p.id] || 0)}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="rounded-b-sm overflow-hidden">
              <div style={{ height: 12, backgroundColor: PAPER,
                clipPath: "polygon(0% 0%,100% 0%,100% 40%,92% 100%,84% 40%,76% 100%,68% 40%,60% 100%,52% 40%,44% 100%,36% 40%,28% 100%,20% 40%,12% 100%,4% 40%,0% 100%)" }} />
            </div>

            <div className="flex gap-2 mt-4">
              <button onClick={copyText} className="flex-1 font-semibold text-[13px] py-2.5 rounded-lg active:scale-[0.98] transition-transform" style={{ background: "#E4DBC4", color: INK, border: "none", cursor: "pointer" }}>Copiar texto</button>
              <button onClick={exportImage} disabled={exporting} className="flex-1 font-semibold text-[13px] py-2.5 rounded-lg active:scale-[0.98] transition-transform text-white disabled:opacity-60" style={{ background: GOLD, border: "none", cursor: "pointer" }}>{exporting ? "Gerando…" : "Baixar imagem"}</button>
            </div>
            <p className="text-[11px] text-center mt-2" style={{ color: INK_SOFT }}>
              Toque em valores, descrições ou nomes para editar. Toque no selo "Todos" de um extra pra escolher de quem é.
            </p>
          </div>
        </div>
      </div>

      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 text-[12.5px] px-4 py-2 rounded-full shadow-lg" style={{ background: INK, color: PAPER }}>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Jambalaia />);
</script>
</body>
</html>
